# Instancia propia de Nitter para el bot. Corre en el Pi, no se expone a internet.
services:
  nitter:
    image: zedeus/nitter:latest
    container_name: nitter
    ports:
      # Solo loopback: que no quede escuchando en la red aunque el Pi tenga puertos abiertos
      - "127.0.0.1:19050:19050"
    volumes:
      - ./nitter.conf:/src/nitter.conf:ro
      - ./sessions.jsonl:/src/sessions.jsonl:ro
    depends_on:
      nitter-redis:
        condition: service_healthy
    restart: unless-stopped
    # Sin healthcheck a propósito: el único chequeo real sería pedir un RSS, y eso son llamadas
    # de verdad a la API de X que gastan el rate limit de la sesión. Para saber si anda, el
    # curl del README a mano; para saber si dejó de andar, el aviso del bot en #robot-devil
    security_opt:
      - no-new-privileges:true

  nitter-redis:
    image: redis:7-alpine
    container_name: nitter-redis
    # En lista y no en string: así el --save "" llega como argumento vacío y no como dos comillas
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
