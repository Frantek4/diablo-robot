[Server]
address = "0.0.0.0"
port = 19050
https = false
# Nitter guarda las conexiones que abre contra x.com y las reusa. Entre vuelta y vuelta del bot
# pasan horas, así que del otro lado hace rato que las cerraron: el pedido siguiente escribe sobre
# un socket muerto, revienta con `ProtocolError: Connection was closed before full request has been
# made` y el catch-all de `apiutils.nim` lo disfraza de "Instance has been rate limited". Encima
# `acquire` saca siempre la más vieja del pool, o sea justo la que con más razón está muerta. Con 0
# no guarda ninguna y cada pedido abre la suya: a 30 pedidos por día un handshake de más no se
# nota, los 429 inventados sí
httpMaxConnections = 0
staticDir = "./public"
title = "nitter"
hostname = "localhost:19050"

[Cache]
# El bot chequea una vez por hora, así que cacheo el RSS una hora: no pierdo frescura y me
# ahorro pedirle a X un feed que ya pedí (reinicios, reintentos, dos cuentas que se repiten)
listMinutes = 240
rssMinutes = 60
redisHost = "nitter-redis"
redisPort = 6379
redisPassword = ""
redisConnections = 4
redisMaxConnections = 16

[Config]
# Generalo con: openssl rand -hex 32
hmacKey = "REEMPLAZAR"
base64Media = false
enableRSS = true
# Expone /.sessions con el rate limit que X reporta por sesión, para no andar adivinando cuánto
# margen queda. De paso loguea cada request, que en este volumen es ruido tolerable
enableDebug = true
proxy = ""
proxyAuth = ""

[Preferences]
theme = "Nitter"
replaceTwitter = ""
replaceYouTube = ""
replaceReddit = ""
proxyVideos = true
hlsPlayback = false
infiniteScroll = false
